<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Campus Music Fest 2026</title>
    <link rel="stylesheet" href="styleCobaPTI-C.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">Campus<span>Fest</span></div>
            <ul class="nav-links">
                <li><a href="Index.html">Home</a></li>
                <li><a href="About.html">About</a></li>
                <li><a href="Schedule.html">Schedule</a></li>
                <li><a href="Register.html">Register</a></li>
                <li><a href="Login.html" class="btn-nav active">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="form-box">
            <h2>Login Peserta</h2>
            <form id="loginForm" style="margin-top: 15px;">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="Masukkan email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Masukkan password" required>
                </div>
                <p id="error-message" style="margin-bottom: 10px; font-size: 0.9rem;"></p>
                <button type="submit" class="btn-submit">Masuk</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Kelompok Tugas Rancang PTI - Campus Art & Music Festival</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
