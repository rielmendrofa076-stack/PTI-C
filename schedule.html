<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule - Campus Music Fest 2026</title>
    <link rel="stylesheet" href="CSS.css">
</head>
<body data-page="schedule">
    <header id="hdr"></header>

    <main class="container soon">
        <h1>Coming<span class="out">soon</span></h1>
        <p class="lead">Jadwal dan lineup lengkap masih kami racik. Hitung mundur menuju hari pertama festival:</p>

        <div class="count" aria-live="off">
            <div><b id="cd">00</b>Hari</div>
            <div><b id="ch">00</b>Jam</div>
            <div><b id="cm">00</b>Menit</div>
            <div><b id="cs">00</b>Detik</div>
        </div>

        <div class="tba">
            <article class="act" style="--c: var(--pink)">
                <h3>Hari 1: Indie Stage</h3>
                <p>Lineup dan rundown segera diumumkan.</p>
            </article>
            <article class="act" style="--c: var(--violet)">
                <h3>Hari 2: Main Concert</h3>
                <p>Lineup dan rundown segera diumumkan.</p>
            </article>
        </div>

        <a class="btn go" href="https://instagram.com/campusfest2026" target="_blank" rel="noopener">Ikuti Instagram untuk pengumuman</a>
    </main>

    <footer id="ftr"></footer>
    <script src="script.js"></script>
</body>
</html>
